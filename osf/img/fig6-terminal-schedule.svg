<text x="28" y="50" fill="#b98a2f" font-size="15" class="mono">FIG. 6 · THE TERMINAL STRIP — LANDING SCHEDULE · PANEL ABOVE, FIELD BELOW</text>
<text x="1032" y="40" fill="#55636e" font-size="13" class="mono" text-anchor="end">OSF HARDWARE ANNEX A</text>
<rect y="64" width="1060" height="4" fill="#9d3226"/>
<text x="28" y="98" fill="#20262b" font-size="18" class="cond" font-weight="600">THE STRIP IS THE CONTRACT: PANEL WIRING LANDS ON TOP IN NFPA COLORS, FIELD WIRING LANDS BELOW IN FACTORY COLORS.</text>

