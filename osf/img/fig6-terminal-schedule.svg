<!-- landing table -->
<g transform="translate(30,290)">
<text x="0" y="0" fill="#20262b" font-size="17" class="cond" font-weight="700">LANDING SCHEDULE — VALVE 1 TRACK (REPEAT PATTERN FOR TRACKS 2 AND 3)</text>
<g font-size="12.5" fill="#20262b">
<text x="0" y="28" class="mono" fill="#b98a2f">TB1</text><text x="46" y="28">M+ · field: valve RED (drive +) · panel: BLUE from PLC RELAY 1 OUT — the only drive path</text>
<text x="0" y="52" class="mono" fill="#b98a2f">TB2</text><text x="46" y="52">M− · field: valve BLACK (drive −) · panel: WHT/BLU to 0V common (G1)</text>
<text x="0" y="76" class="mono" fill="#b98a2f">TB3</text><text x="46" y="76">LCOM · field: valve GRN/WHT (limit common) · panel: BLUE from 24V+ bus — wets the switches</text>
<text x="0" y="100" class="mono" fill="#b98a2f">TB4</text><text x="46" y="100">OPN · field: valve YELLOW (open limit) · panel: BLUE to PLC IN_0, teed to ACT lamp group (see box)</text>
<text x="0" y="124" class="mono" fill="#b98a2f">TB5</text><text x="46" y="124">CLS · field: valve BLUE (closed limit) · panel: BLUE to PLC IN_1, teed to RDY lamp chain (see box)</text>
</g>
<text x="0" y="158" fill="#55636e" font-size="12" class="mono">TRACK 2 → IN_2/IN_3 · TRACK 3 → IN_4/IN_5 · SAME PATTERN, NEXT CHANNELS</text>
</g>

<g transform="translate(30,478)">
<text x="0" y="0" fill="#20262b" font-size="17" class="cond" font-weight="700">SENSOR BLOCKS</text>
<g font-size="12.5" fill="#20262b">
<text x="0" y="26" class="mono" fill="#b98a2f">TB16</text><text x="56" y="26">XD+ · transducer RED · panel: BLUE from 24V+ bus (4-20mA loop power)</text>
<text x="0" y="50" class="mono" fill="#b98a2f">TB17</text><text x="56" y="50">XSIG · transducer BLACK/shield · panel: BLUE to PLC AI_0 — the loop return IS the signal</text>
<text x="0" y="74" class="mono" fill="#b98a2f">TB18</text><text x="56" y="74">5V+ · panel: from PLC 5V logic rail — noise-isolated feed for the meter</text>
<text x="0" y="98" class="mono" fill="#b98a2f">TB19</text><text x="56" y="98">PLS · flow meter pulse out · panel: BLUE to PLC IN_6 — the totalizer counts here</text>
<text x="0" y="122" class="mono" fill="#b98a2f">TB20</text><text x="56" y="122">FCOM · flow meter common · panel: WHT/BLU to 0V (G1)</text>
</g>
</g>

<g transform="translate(30,632)">
<text x="0" y="0" fill="#20262b" font-size="17" class="cond" font-weight="700">GROUND BLOCKS — TWO GROUNDS, NEVER MIXED</text>
<g font-size="12.5" fill="#20262b">
<text x="0" y="26" class="mono" fill="#b98a2f">G1</text><text x="40" y="26">0V DC MASTER (WHT/BLU block) — supply negative, DC-UPS negative, valve and sensor returns tie here</text>
<text x="0" y="50" class="mono" fill="#b98a2f">G2</text><text x="40" y="50">CHASSIS EARTH (GREEN rail-bond block) — AC mains ground, enclosure shell, door braid. Bonds to the DIN rail itself.</text>
</g>
</g>

<!-- LED logic box -->
<g transform="translate(640,430)">
<rect x="0" y="0" width="390" height="180" fill="#fffef9" stroke="#9d3226" stroke-width="2.5"/>
<text x="18" y="30" fill="#9d3226" font-size="15" class="cond" font-weight="700">LAMP LOGIC — WIRED TRUTH, THREE VALVES</text>
<text x="18" y="56" fill="#20262b" font-size="12.5">RDY (white): all three CLOSED switches in SERIES →</text>
<text x="18" y="74" fill="#20262b" font-size="12.5">lamp lights only when EVERY valve confirms closed.</text>
<text x="18" y="100" fill="#20262b" font-size="12.5">ACT (red): all three OPEN switches in PARALLEL →</text>
<text x="18" y="118" fill="#20262b" font-size="12.5">lamp lights when ANY valve is physically open.</text>
<text x="18" y="146" fill="#55636e" font-size="11.5" class="mono">RELAY LOGIC IN COPPER — THE LAMPS DESCRIBE THE</text>
<text x="18" y="162" fill="#55636e" font-size="11.5" class="mono">SYSTEM, NOT ONE VALVE, AND NEVER THE SOFTWARE.</text>
</g>

<rect y="828" width="1060" height="52" fill="#20262b"/>
<text x="28" y="859" fill="#f7f5f0" font-size="11.5" class="mono">INSTRUCTIONAL — BUILD TO THE HARDWARE ANNEX · NAMED PARTS LIVE IN THE ANNEX PARTS CATALOGUE · THE REGISTER GOVERNS</text>
<text x="1032" y="859" fill="#b98a2f" font-size="12.5" class="mono" text-anchor="end">FREE LIKE A FIRE CODE</text>
</svg>
